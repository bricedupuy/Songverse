name: CI

on:
  push:
    # Work branches too, so they're checked before reaching main. Deploys
    # stay main-only (see deploy-api's condition).
    branches: [main, "claude/**"]
  pull_request:

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/songverse_test?schema=public"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: songverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @songverse/db exec prisma migrate deploy

      - name: Lint
        run: pnpm turbo lint

      - name: Type-check
        run: pnpm turbo type-check

      - name: Test
        run: pnpm turbo test

  # Whether a push changes more than documentation (the user docs in
  # apps/docs, the website in apps/site, the specs in docs/, Markdown
  # files), which the e2e suites have nothing to say about.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no "before" to compare with: treat it as code.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(apps/docs/|apps/site/|docs/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    # The API and browser suites in e2e/, against production builds of the
    # API and web app. Emails print to the API's output (no email provider
    # configured), which the suites read verification links from.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: songverse_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/songverse_e2e?schema=public"
      E2E_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/songverse_e2e"
      E2E_API_LOG: /tmp/api.log
      REDIS_URL: "redis://localhost:6379"
      AUTH_URL: "http://localhost:3001"
      WEB_URL: "http://localhost:3000"
      API_URL: "http://localhost:3001"
      # Test-only values; nothing real is protected by them.
      BETTER_AUTH_SECRET: "e2e-only-secret-not-for-production-use"
      SETTINGS_ENCRYPTION_KEY: "e2e-only-settings-key-not-for-production-use"
      MUSICBRAINZ_CONTACT: "https://github.com/bricedupuy/Songverse"
      # Song artwork (issue #85) and song info (issue #22) from the suites' stand-ins for
      # Apple Music (and its API), MusicBrainz and Deezer (e2e/lib/fake-providers.mjs).
      ITUNES_SEARCH_URL: "http://localhost:3999"
      MUSICBRAINZ_API_URL: "http://localhost:3999/mb/ws/2/"
      DEEZER_API_URL: "http://localhost:3999/deezer"
      APPLE_MUSIC_API_URL: "http://localhost:3999/applemusic"
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @songverse/e2e exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm --filter @songverse/db exec prisma migrate deploy

      - name: Build the API and web app
        run: pnpm turbo build --filter=@songverse/api --filter=@songverse/web

      # The suites use the built-in tags and other metadata the seed adds.
      # It runs after the build, which builds @songverse/core for it.
      - name: Seed the database
        run: pnpm --filter @songverse/db seed

      - name: Start the API and web app
        run: |
          (cd apps/api && PORT=3001 node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && PORT=3000 node server.mjs > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "The API or web app didn't start"; tail -50 /tmp/api.log /tmp/web.log; exit 1

      - name: Run the end-to-end suites
        run: pnpm --filter @songverse/e2e e2e

      - name: Keep screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            e2e/.artifacts/
            /tmp/api.log
            /tmp/web.log
          retention-days: 7

  # Builds the images Dokploy deploys, so a Dockerfile that no longer
  # matches the code fails here rather than on the server. Nothing is pushed.
  # (The docs image also checks every internal link, in its build.)
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web, docs, site]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Dockerfile.${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          load: ${{ matrix.image == 'site' }}
          tags: songverse-${{ matrix.image }}:ci
      # The website serves its pages and sends every other path to the app.
      - name: Check the website's redirects
        if: matrix.image == 'site'
        run: |
          docker run -d --name site -p 8080:80 songverse-site:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8080/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q 'ready to play'
          curl -sf http://localhost:8080/fr/ | grep -q 'prêts à jouer'
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' 'http://localhost:8080/sets/abc?share=x')" = "301 https://app.songverse.one/sets/abc?share=x"

  deploy-api:
    needs: [build-test, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requires DOKPLOY_WEBHOOK_URL secret (a deploy-trigger webhook
      # configured on the API service in Dokploy). Configure this once the
      # VPS + Dokploy app from spec §5 is provisioned.
      - name: Trigger Dokploy deploy
        if: ${{ vars.DOKPLOY_WEBHOOK_URL != '' }}
        run: curl -fsSL -X POST "${{ vars.DOKPLOY_WEBHOOK_URL }}"
